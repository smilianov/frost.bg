name = "frost-bg"
main = "worker/index.js"
compatibility_date = "2026-09-01"

# Публичният адрес. Custom domain-ът създава DNS записа и сертификата сам
# (token-ът има Zone DNS Edit). workers.dev адресът е спрян — един сайт, един
# адрес; лимитът на заявките пази само зоната frost.bg.
routes = [{ pattern = "frost.bg", custom_domain = true }]
workers_dev = false

[assets]
directory = "./site"
binding = "ASSETS"

[vars]
GEOCODER = "openmeteo"      # openmeteo | google
MAP = "osm"                 # osm | google
GOOGLE_MAPS_KEY = ""        # ключ за Google Maps JS (в браузъра; ограничен по домейн)
ELEVATION = "on"            # "off" изключва /api/v1/elevation и реда на екрана
# Тайните не са тук: локално в .dev.vars, в продукция с `wrangler secret put` — виж README.
